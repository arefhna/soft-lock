name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Flutter create (android structure)
        run: flutter create --platforms=android --org com.codestackaz --project-name soft_lock .

      - name: Overwrite AndroidManifest
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Soft Lock"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Create keystore
        run: |
          keytool -genkey -v -keystore android/app/lock.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias lock -storepass lock123 -keypass lock123 \
            -dname "CN=Arif Qocayev, OU=codestack.az studio, O=codestack.az, L=Baku, S=Baku, C=AZ"

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=lock123
          keyPassword=lock123
          keyAlias=lock
          storeFile=lock.jks
          EOF

      - name: Patch build.gradle for signing
        run: |
          GRADLE_FILE=android/app/build.gradle
          sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' $GRADLE_FILE
          
          python3 << 'PYEOF'
          import re
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          
          keystore_code = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          
          """
          
          content = re.sub(
              r'(plugins \{[\s\S]*?\n\})',
              r'\1\n' + keystore_code,
              content,
              count=1
          )
          
          signing_config = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          """
          
          content = re.sub(
              r'buildTypes \{[\s\S]*?\n    \}',
              signing_config.strip(),
              content,
              count=1
          )
          
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          PYEOF

      - name: Build APK (signed)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/soft-lock.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Soft Lock v1.0.${{ github.run_number }}
          body: |
            ## 🔒 Soft Lock v1.0.${{ github.run_number }}
            
            **Proqramçı:** Arif Qocayev
            **Studio:** codestack.az studio
            
            ### Xüsusiyyətlər
            - 🔒 Toxunuşu blokla
            - ⬆️ Yuxarı sürüşdürərək aç
            - 🕐 Saat və tarix
            - 🌙 Dark mode
            - 📊 Statistika
          
            
            ### Quraşdırma
            1. APK-nı yüklə
            2. Telefonda aç
            3. Play Protect xəbərdarlığı çıxsa **"Yenə də quraşdır"** bas
          files: output/soft-lock.apk
          draft: false
          prerelease: false
